server:
  port: 8080
  mode: ${MODE} # debug, release

database:
  host: ep-sweet-hill-a1a76thg.ap-southeast-1.aws.neon.tech
  port: 5432
  user: neondb_owner
  password: ${DB_PASSWORD}
  dbname: neondb
  sslmode: require
  timezone: Asia/Bangkok
  auto_migrate: false  # ตั้ง true เมื่อต้องการ migrate schema

cloudflare:
  r2:
    account_id: ${CF_ACCOUNT_ID}
    access_key_id: ${CF_ACCESS_KEY_ID}
    secret_access_key: ${CF_SECRET_ACCESS_KEY}
    bucket_name: storagehotline
    public_url: https://photo.akin.love

jwt:
  secret: ${JWT_SECRET}
  access_token_expiry: 1h
  refresh_token_expiry: 168h # 7 days

integration:
  clinic_tool_key: ${CLINIC_TOOL_INTEGRATION_KEY}

cors:
  allowed_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
    - http://localhost:5173
    - https://hotlines3.vercel.app
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed_headers:
    - Origin
    - Content-Type
    - Authorization
